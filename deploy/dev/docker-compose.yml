version: "3.10"

networks:
  fba_network:
    name: fba_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.10.0/24

volumes:
  fba_pg:
    name: fba_pg
  fba_redis:
    name: fba_redis
  fba-minio:
    name: fba-minio

services:

  fba_pg:
    image: paradedb/paradedb:0.15.20-pg16
    container_name: fba_pg
    ports:
      - "5433:5432"
    restart: always
    volumes:
      - fba_pg:/var/lib/postgresql/data/
    networks:
      - fba_network
    environment:
      - PGDATA=/var/lib/postgresql/data/
      - POSTGRES_PASSWORD=changethis
      - POSTGRES_USER=postgres
      - POSTGRES_DB=fba


  fba_redis:
    image: redis:6.2.7
    ports:
      - "${DOCKER_REDIS_MAP_PORT:-6379}:6379"
    container_name: fba_redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - fba_redis:/data
    networks:
      - fba_network

  fba-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000"
      - "9001:9001"
    container_name: fba-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - fba-minio:/data
    networks:
      - fba_network
    command:
      - server
      - /data
      - --console-address=0.0.0.0:9001
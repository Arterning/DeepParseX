version: "3.10"

networks:
  fba_network:
    name: fba_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.10.0/24

volumes:
  fba_pg:
    name: fba_pg
  fba_redis:
    name: fba_redis
  fba_static:
    name: fba_static
  fba-minio:
    name: fba-minio
  fba_rabbitmq:
    name: fba_rabbitmq

services:
  fba_server:
    build:
      context: ../../../
      dockerfile: backend/backend.dockerfile
    image: fba_server:latest
    ports:
      - "8001:8001"
    container_name: fba_server
    restart: always
    depends_on:
      - fba_pg
      - fba_redis
      - fba-minio
    volumes:
      - fba_static:/fba/backend/app/static
      # MCP Playwright: 允许容器内创建 Docker 兄弟容器
      # 安全提示：生产环境建议改为独立 playwright service + HTTP 模式
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fba_network
    environment:
      - OA_API_URL=http://OA_IP:PORT
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_pg:5432 -s fba_redis:6379 -t 300
        mkdir -p /var/log/supervisor/
        rm -f /fba/backend/gunicorn.pid
        supervisord -c /fba/deploy/backend/supervisor.conf
        supervisorctl restart fastapi_server

  fba_pg:
    image: paradedb/paradedb:0.15.20-pg16
    container_name: fba_pg
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - fba_pg:/var/lib/postgresql/data/
    networks:
      - fba_network
    environment:
      - PGDATA=/var/lib/postgresql/data/
      - POSTGRES_PASSWORD=changethis
      - POSTGRES_USER=postgres
      - POSTGRES_DB=fba


  fba_redis:
    image: redis:6.2.7
    ports:
      - "${DOCKER_REDIS_MAP_PORT:-6379}:6379"
    container_name: fba_redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - fba_redis:/data
    networks:
      - fba_network


  fba_ui:
    image: fba_ui:latest
    ports:
      - "80:80"
      - "443:443"
    container_name: fba_ui
    restart: always
    command:
      - nginx
      - -g
      - daemon off;
    volumes:
      # nginx https conf
      # When deploying through docker, you need to open this configuration item and
      # ensure that the docker_ssl path is consistent with that in nginx conf
      # - local_ssl_pem_path:/etc/ssl/xxx.pem
      # - local_ssl_key_path:/etc/ssl/xxx.key
      - fba_static:/www/fba_server/backend/static
    networks:
      - fba_network


  fba-embed:
    image: fba-embed:latest
    container_name: fba_embed
    restart: always
    ports:
      - "8003:8003"
    networks:
      - fba_network


  # ── MCP Playwright (备选方案：HTTP 模式，默认不启动) ──
  # 启动: docker compose --profile playwright up -d playwright
  # 使用 HTTP 模式时，将 .mcp.json 中 playwright 改为 url 配置
  playwright:
    image: mcr.microsoft.com/playwright/mcp
    container_name: fba_playwright
    restart: unless-stopped
    profiles:
      - playwright
    networks:
      - fba_network
    command:
      - "--port"
      - "3000"
      - "--host"
      - "0.0.0.0"
      - "--allowed-hosts"
      - "*"

  # quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1
  fba-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    ports:
      - "9000:9000"
      - "9001:9001"
    container_name: fba-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - fba-minio:/data
    networks:
      - fba_network
    command:
      - server
      - /data
      - --console-address=0.0.0.0:9001